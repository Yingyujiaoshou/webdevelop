<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语词汇朗读版 · 学考基础词汇</title>
<style>
  :root{
    --navy:#1F3A5F; --red:#C0392B; --ink:#222; --muted:#777;
    --line:#e2e6ec; --bg:#f4f6f9; --card:#fff; --hi:#fff6d6; --amber:#B8860B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:16px}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}
  header{background:linear-gradient(135deg,#1F3A5F,#2d5490);color:#fff;border-radius:14px;
    padding:20px 24px;margin-bottom:16px}
  header h1{margin:0 0 6px;font-size:24px}
  header p{margin:0;opacity:.85;font-size:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
  .row label{font-size:14px;color:#555}
  select,input[type=range]{font-size:15px}
  select{padding:8px 10px;border:1px solid #cbd2dc;border-radius:8px;background:#fff;color:#222;max-width:100%}
  button{border:none;border-radius:9px;padding:10px 18px;font-size:15px;cursor:pointer;font-weight:600;color:#fff}
  .btn-play{background:var(--navy)} .btn-play:hover{background:#162d4a}
  .btn-stop{background:#8a8f98} .btn-stop:hover{background:#6f747c}
  .btn-single{background:var(--red)} .btn-single:hover{background:#9e2e22}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:22px;text-align:center;margin-bottom:14px;min-height:150px}
  .stage .idx{font-size:13px;color:var(--muted)}
  .stage .en{font-size:46px;font-weight:700;color:var(--navy);margin:10px 0 6px;word-break:break-word}
  .stage .ph{font-size:18px;color:var(--amber);font-family:"Lucida Sans Unicode",serif}
  .stage .pos{font-size:14px;color:#999;margin-left:8px}
  .stage .zh{font-size:26px;color:var(--red);margin-top:12px}
  .stage .tip{font-size:13px;color:#aaa;margin-top:12px}
  .bar{height:6px;background:#eceff3;border-radius:6px;overflow:hidden;margin-top:14px}
  .bar>i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .list h3{margin:0;padding:14px 18px;font-size:16px;background:#fafbfc;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #eef1f4;font-size:15px}
  th{font-size:13px;color:#777;background:#fafbfc;position:sticky;top:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f0f5fb}
  tr.active{background:var(--hi)}
  .no{color:#aaa;width:44px}
  .w{font-weight:700;color:var(--navy)}
  .ph{color:var(--amber);font-family:"Lucida Sans Unicode",serif;font-size:14px}
  .zh{color:#333}
  .scroll{max-height:520px;overflow:auto}
  .badge{font-size:12px;padding:2px 8px;border-radius:20px;background:#eef3fa;color:var(--navy)}
  .warn{font-size:13px;color:#a33;background:#fdf3f2;border:1px solid #f5d5d0;padding:10px 12px;border-radius:8px;margin-top:10px;display:none}
  .pinbar{background:#eef4fb;border:1px dashed #b9cde3;border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px;color:#31557f}
  body.pin-panel .panel{position:sticky;top:0;z-index:30;box-shadow:0 6px 18px rgba(31,58,95,.16)}
  body.pin-stage .stage{position:sticky;z-index:20;box-shadow:0 6px 18px rgba(31,58,95,.12)}
  th{z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>英语词汇朗读版</h1>
    <p>广西高中学业水平考试 · 基础词汇　｜　先读英文单词，再读中文意思</p>
  </header>

  <div class="pinbar">
    <label style="margin-right:16px"><input type="checkbox" id="pinPanel"> 固定控制面板在屏幕顶部</label>
    <label><input type="checkbox" id="pinStage"> 固定当前单词卡片（跟读时始终可见）</label>
  </div>

  <div class="panel" id="panel">
    <div class="row">
      <label for="themeSelect">选择主题：</label>
      <select id="themeSelect" style="flex:1;min-width:260px"></select>
      <span class="badge" id="countBadge">— 词</span>
    </div>
    <div class="row">
      <button class="btn-play" id="playBtn">▶ 整段连播</button>
      <button class="btn-stop" id="stopBtn">■ 停止</button>
      <label>语速：</label>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.8">
      <span id="rateVal">0.8×</span>
      <label><input type="checkbox" id="loop"> 循环</label>
      <label><input type="checkbox" id="autoNext" checked> 读完自动下一个</label>
    </div>
    <div class="row">
      <label>中文声音：</label>
      <select id="zhVoice"></select>
      <label>英文声音：</label>
      <select id="enVoice"></select>
    </div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="stage" id="stage">
    <div class="idx" id="idx">准备就绪 · 点“整段连播”开始，或点下方任意单词单独朗读</div>
    <div class="en" id="en">Ready</div>
    <div><span class="ph" id="ph"></span><span class="pos" id="pos"></span></div>
    <div class="zh" id="zh">按顺序：英文 → 中文</div>
    <div class="bar"><i id="progress"></i></div>
  </div>

  <div class="list">
    <h3>当前主题词表 <span style="font-weight:400;color:#999;font-size:13px">（点任意一行从该词单独朗读）</span></h3>
    <div class="scroll" id="scroll">
      <table>
        <thead><tr><th class="no">#</th><th>单词</th><th>音标</th><th>词性</th><th>中文</th><th>朗读</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

 "n.", "zh": "桶"}, {"w": "basket", "ph": "/ˈbɑːskɪt/", "pos": "n.", "zh": "篮子"}, {"w": "container", "ph": "/kənˈteɪnə(r)/", "pos": "n.", "zh": "容器"}, {"w": "lid", "ph": "/lɪd/", "pos": "n.", "zh": "盖子"}, {"w": "handle", "ph": "/ˈhændl/", "pos": "n.", "zh": "把手"}, {"w": "switch", "ph": "/swɪtʃ/", "pos": "n.", "zh": "开关"}, {"w": "button", "ph": "/ˈbʌtn/", "pos": "n.", "zh": "按钮；纽扣"}, {"w": "battery", "ph": "/ˈbætri/", "pos": "n.", "zh": "电池"}, {"w": "cable", "ph": "/ˈkeɪbl/", "pos": "n.", "zh": "电缆"}, {"w": "plug", "ph": "/plʌɡ/", "pos": "n.", "zh": "插头"}, {"w": "rope", "ph": "/rəʊp/", "pos": "n.", "zh": "绳"}, {"w": "net", "ph": "/net/", "pos": "n.", "zh": "网"}, {"w": "frame", "ph": "/freɪm/", "pos": "n.", "zh": "框架"}, {"w": "board", "ph": "/bɔːd/", "pos": "n.", "zh": "木板；董事会"}, {"w": "nail", "ph": "/neɪl/", "pos": "n.", "zh": "钉子；指甲"}, {"w": "screw", "ph": "/skruː/", "pos": "n.", "zh": "螺丝"}, {"w": "pipe", "ph": "/paɪp/", "pos": "n.", "zh": "管子"}, {"w": "pump", "ph": "/pʌmp/", "pos": "n.", "zh": "泵"}, {"w": "engine", "ph": "/ˈendʒɪn/", "pos": "n.", "zh": "发动机"}, {"w": "wheel", "ph": "/wiːl/", "pos": "n.", "zh": "轮子"}, {"w": "motor", "ph": "/ˈməʊtə(r)/", "pos": "n.", "zh": "马达"}]}, {"name": "主题37　数量程度与比较", "level": "进阶级", "words": [{"w": "amount", "ph": "/əˈmaʊnt/", "pos": "n.", "zh": "数量"}, {"w": "total", "ph": "/ˈtəʊtl/", "pos": "n./adj.", "zh": "总数；总的"}, {"w": "average", "ph": "/ˈævərɪdʒ/", "pos": "n./adj.", "zh": "平均"}, {"w": "percent", "ph": "/pəˈsent/", "pos": "n.", "zh": "百分之……"}, {"w": "rate", "ph": "/reɪt/", "pos": "n.", "zh": "比率；速度"}, {"w": "ratio", "ph": "/ˈreɪʃiəʊ/", "pos": "n.", "zh": "比例"}, {"w": "double", "ph": "/ˈdʌbl/", "pos": "v./adj.", "zh": "加倍；双倍的"}, {"w": "twice", "ph": "/twaɪs/", "pos": "adv.", "zh": "两次；两倍"}, {"w": "several", "ph": "/ˈsevrəl/", "pos": "adj.", "zh": "几个"}, {"w": "various", "ph": "/ˈveəriəs/", "pos": "adj.", "zh": "各种各样的"}, {"w": "numerous", "ph": "/ˈnjuːmərəs/", "pos": "adj.", "zh": "众多的"}, {"w": "plenty", "ph": "/ˈplenti/", "pos": "n.", "zh": "大量"}, {"w": "lack", "ph": "/læk/", "pos": "n./v.", "zh": "缺乏"}, {"w": "shortage", "ph": "/ˈʃɔːtɪdʒ/", "pos": "n.", "zh": "短缺"}, {"w": "extra", "ph": "/ˈekstrə/", "pos": "adj.", "zh": "额外的"}, {"w": "spare", "ph": "/speə(r)/", "pos": "adj.", "zh": "多余的；备用的"}, {"w": "remaining", "ph": "/rɪˈmeɪnɪŋ/", "pos": "adj.", "zh": "剩余的"}, {"w": "limit", "ph": "/ˈlɪmɪt/", "pos": "n./v.", "zh": "限制"}, {"w": "minimum", "ph": "/ˈmɪnɪməm/", "pos": "n./adj.", "zh": "最小（的）"}, {"w": "maximum", "ph": "/ˈmæksɪməm/", "pos": "n./adj.", "zh": "最大（的）"}, {"w": "increase", "ph": "/ˈɪnkriːs/", "pos": "n.", "zh": "增加"}, {"w": "decrease", "ph": "/ˈdiːkriːs/", "pos": "n.", "zh": "减少"}, {"w": "grow", "ph": "/ɡrəʊ/", "pos": "v.", "zh": "增长"}, {"w": "reduce", "ph": "/rɪˈdjuːs/", "pos": "v.", "zh": "减少"}, {"w": "rise", "ph": "/raɪz/", "pos": "v./n.", "zh": "上升"}, {"w": "fall", "ph": "/fɔːl/", "pos": "v./n.", "zh": "下降；落下"}, {"w": "higher", "ph": "/ˈhaɪə(r)/", "pos": "adj.", "zh": "更高的"}, {"w": "lower", "ph": "/ˈləʊə(r)/", "pos": "adj.", "zh": "更低的"}, {"w": "better", "ph": "/ˈbetə(r)/", "pos": "adj./adv.", "zh": "更好的（地）"}, {"w": "worse", "ph": "/wɜːs/", "pos": "adj./adv.", "zh": "更差的（地）"}, {"w": "best", "ph": "/best/", "pos": "adj./adv.", "zh": "最好的（地）"}, {"w": "worst", "ph": "/wɜːst/", "pos": "adj./adv.", "zh": "最差的（地）"}, {"w": "more", "ph": "/mɔː(r)/", "pos": "adj./adv.", "zh": "更多的"}, {"w": "less", "ph": "/les/", "pos": "adj./adv.", "zh": "更少的"}, {"w": "least", "ph": "/liːst/", "pos": "adj./adv.", "zh": "最少的"}, {"w": "most", "ph": "/məʊst/", "pos": "adj./adv.", "zh": "最多的"}, {"w": "quite", "ph": "/kwaɪt/", "pos": "adv.", "zh": "相当"}, {"w": "rather", "ph": "/ˈrɑːðə(r)/", "pos": "adv.", "zh": "相当；宁愿"}, {"w": "fairly", "ph": "/ˈfeəli/", "pos": "adv.", "zh": "相当；公平地"}, {"w": "slightly", "ph": "/ˈslaɪtli/", "pos": "adv.", "zh": "稍微"}, {"w": "extremely", "ph": "/ɪkˈstriːmli/", "pos": "adv.", "zh": "极其"}, {"w": "especially", "ph": "/ɪˈspeʃəli/", "pos": "adv.", "zh": "特别"}, {"w": "particularly", "ph": "/pəˈtɪkjələli/", "pos": "adv.", "zh": "尤其"}, {"w": "completely", "ph": "/kəmˈpliːtli/", "pos": "adv.", "zh": "彻底地"}, {"w": "nearly", "ph": "/ˈnɪəli/", "pos": "adv.", "zh": "几乎"}, {"w": "roughly", "ph": "/ˈrʌfli/", "pos": "adv.", "zh": "大致"}, {"w": "exactly", "ph": "/ɪɡˈzæktli/", "pos": "adv.", "zh": "确切地"}, {"w": "similarly", "ph": "/ˈsɪmələli/", "pos": "adv.", "zh": "相似地"}, {"w": "generally", "ph": "/ˈdʒenrəli/", "pos": "adv.", "zh": "一般地"}, {"w": "normally", "ph": "/ˈnɔːməli/", "pos": "adv.", "zh": "通常"}, {"w": "gradually", "ph": "/ˈɡrædʒuəli/", "pos": "adv.", "zh": "逐渐地"}]}]};
const themes = DATA.themes;
let cur = 0, words = [], playing = false, paused = false, stopped = false, seq = 0;

const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
let voices = [];

function fillVoices(){
  voices = synth.getVoices() || [];
  const zh = voices.filter(v=>/zh|cmn/i.test(v.lang));
  const en = voices.filter(v=>/^en/i.test(v.lang));
  // 智能打分：自然/神经网络语音优先，剔除低质紧凑音
  const score = v => {
    const n=v.name.toLowerCase(), l=v.lang.toLowerCase(); let s=0;
    if(/natural|neural|premium|online/.test(n)) s+=100;
    if(/microsoft|google/.test(n)) s+=40;
    if(/zira|samantha|ava|andrew|jenny|aria|guy|sonia|hazel|mark|david/.test(n)) s+=30;
    if(/huihui|yaoyao|xiaoxiao|yunyang|kangkang|xiaoyi|google 普通话/.test(n)) s+=30;
    if(/^en-us|^en-gb|^zh-cn/.test(l)) s+=20;
    if(/compact|espeak|e speaks|mobile/.test(n)) s-=80;
    return s;
  };
  const mk = (sel, arr) => {
    sel.innerHTML = '';
    if(!arr.length){ const o=document.createElement('option'); o.textContent='（系统无可用语音）'; sel.appendChild(o); return; }
    const sorted=arr.slice().sort((a,b)=>score(b)-score(a));
    sorted.forEach(v=>{ const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=v.name+' ('+v.lang+')'; sel.appendChild(o); });
    sel.selectedIndex=0;
  };
  mk($('zhVoice'), zh);
  mk($('enVoice'), en);
  if(!zh.length || !en.length){
    const w=$('warn'); w.style.display='block';
    w.textContent='提示：当前浏览器/系统缺少中文或英文语音包。建议用 Windows 上的 Edge 或 Chrome 打开本文件，语音最全。';
  }
}
if(synth && typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = fillVoices;

function loadTheme(i){
  cur = i; stop();
  words = themes[i].words;
  $('countBadge').textContent = words.length + ' 词';
  const tb = $('tbody'); tb.innerHTML='';
  words.forEach((d,k)=>{
    const tr=document.createElement('tr'); tr.dataset.k=k;
    tr.innerHTML = '<td class="no">'+(k+1)+'</td><td class="w">'+esc(d.w)+'</td><td class="ph">'+esc(d.ph)+'</td><td>'+esc(d.pos)+'</td><td class="zh">'+esc(d.zh)+'</td><td>🔊</td>';
    tr.onclick = ()=> single(k);
    tb.appendChild(tr);
  });
  $('idx').textContent = themes[i].level+' · '+themes[i].name+' · 共 '+words.length+' 词';
  $('en').textContent='Ready'; $('ph').textContent=''; $('pos').textContent=''; $('zh').textContent='按顺序：英文 → 中文';
  $('progress').style.width='0%';
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function pickVoice(selId, fallbackLang){
  const sel=$(selId); const v=voices.find(x=>x.voiceURI===sel.value);
  return v || voices.find(x=>x.lang.toLowerCase().startsWith(fallbackLang));
}
function rate(){ return parseFloat($('rate').value); }
function say(text, voice, lang, scale){
  return new Promise(res=>{
    if(stopped){res();return;}
    try{
      const u=new SpeechSynthesisUtterance(text);
      if(voice) u.voice=voice;
      u.lang = voice?voice.lang:lang;
      u.rate = Math.max(0.5, rate()*(scale||1)); u.pitch=1;
      u.onend=res; u.onerror=res;
      synth.speak(u);
    }catch(e){res();}
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
function highlight(k){
  document.querySelectorAll('#tbody tr').forEach(tr=>tr.classList.remove('active'));
  const tr=document.querySelector('#tbody tr[data-k="'+k+'"]');
  if(tr){ tr.classList.add('active'); tr.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  const d=words[k];
  $('idx').textContent='第 '+(k+1)+' / '+words.length+' 词';
  $('en').textContent=d.w; $('ph').textContent=d.ph; $('pos').textContent=d.pos; $('zh').textContent='…（正在读）';
  $('progress').style.width=((k+1)/words.length*100)+'%';
}
async function readOne(k){
  highlight(k);
  const d=words[k];
  // 英文读两遍：先慢速清晰朗读，再正常速；单词本身含空格短语时不拆
  await say(d.w, pickVoice('enVoice','en'), 'en-US', 0.85);
  await wait(350);
  if(stopped) return;
  await say(d.w, pickVoice('enVoice','en'), 'en-US', 1);
  await wait(250);
  if(stopped) return;
  $('zh').textContent=d.zh;
  await say(d.zh, pickVoice('zhVoice','zh'), 'zh-CN');
}
async function single(k){
  stop(); playing=true; seq++; const my=seq;
  await readOne(k);
  if(my===seq){ playing=false; $('idx').textContent='第 '+(k+1)+' 词 · 点下一个继续'; }
}
let resumeFrom=0;
async function playAll(){
  // 暂停中 → 继续：从暂停的词重新读（不依赖浏览器 pause/resume 行为）
  if(paused){
    paused=false; playing=true;
    $('playBtn').textContent='⏸ 暂停';
    await runFrom(resumeFrom);
    return;
  }
  // 播放中 → 暂停
  if(playing){ doPause(); return; }
  if(!words.length) return;
  stopped=false; playing=true; seq++;
  $('playBtn').textContent='⏸ 暂停';
  await runFrom(0);
}
async function runFrom(startK){
  const my=seq;
  do{
    for(let k=startK;k<words.length;k++){
      if(stopped||paused||my!==seq) break;
      await readOne(k);
      if(paused||stopped||my!==seq) break;
      if(!$('autoNext').checked){ resumeFrom=k+1; break; }
      await wait(320);
      resumeFrom=k+1;
    }
    if(paused||stopped||my!==seq) break;
    if(!$('loop').checked) break;
    startK=0; resumeFrom=0;
  }while(true);
  if(my===seq && !paused){ playing=false; $('playBtn').textContent='▶ 整段连播'; }
}
function doPause(){
  paused=true; playing=false;
  resumeFrom=Math.max(0,(resumeFrom||0));
  try{ synth.cancel(); }catch(e){}
  $('playBtn').textContent='▶ 继续';
  $('idx').textContent='已暂停 · 点“继续”从第 '+resumeFrom+' 词接着读';
}
function stop(){
  stopped=true; seq++; playing=false; paused=false; resumeFrom=0;
  try{ synth.cancel(); }catch(e){}
  $('playBtn').textContent='▶ 整段连播';
}

// init
const sel=$('themeSelect');
themes.forEach((t,i)=>{
  const o=document.createElement('option'); o.value=i;
  o.textContent=(t.level==='基础级'?'[基础] ':'[进阶] ')+t.name;
  sel.appendChild(o);
});
sel.onchange=()=>loadTheme(parseInt(sel.value));
$('playBtn').onclick=playAll;
$('stopBtn').onclick=stop;
$('rate').oninput=()=>$('rateVal').textContent=parseFloat($('rate').value).toFixed(1)+'×';

// 固定显示：面板/当前词卡片贴顶，两者都固定时自动错开
function applyPin(){
  document.body.classList.toggle('pin-panel',$('pinPanel').checked);
  document.body.classList.toggle('pin-stage',$('pinStage').checked);
  const panel=$('panel'), stage=$('stage');
  stage.style.top = $('pinPanel').checked ? (panel.getBoundingClientRect().height+8)+'px' : '0px';
}
$('pinPanel').onchange=applyPin;
$('pinStage').onchange=applyPin;
window.addEventListener('resize',applyPin);
applyPin();

loadTheme(0);
fillVoices();
</script>
</body>
</html>
